
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaliniMart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #26352b;
        }

        header {
            background: #198754;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5ce;
            border-radius: 6px;
            font: inherit;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e7ece8;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        button, .back-link {
            display: inline-block;
            border: none;
            border-radius: 7px;
            padding: 13px 18px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .place-order {
            width: 100%;
            margin-top: 20px;
            background: #198754;
            color: white;
            font-weight: bold;
        }

        .place-order:hover {
            background: #146c43;
        }

        .back-link {
            margin-top: 20px;
            background: #e8f1eb;
            color: #198754;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 700px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>MaliniMart</h1>
        <p>Secure Checkout</p>
    </header>

    <main class="container">
        <h2>Complete Your Order</h2>

        <div class="checkout-layout">
            <section class="panel">
                <h2>Delivery Details</h2>

                <form id="checkoutForm">
                    <label for="customerName">Full Name</label>
                    <input id="customerName" name="customerName"
                           type="text" required>

                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           title="Enter a 10-digit phone number"
                           required>

                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address"
                              rows="4" required></textarea>

                    <button class="place-order" type="submit">
                        Place Order
                    </button>

                    <p id="message" role="status"></p>
                </form>
            </section>

            <section class="panel">
                <h2>Order Summary</h2>

                <div id="checkoutItems">
                    Loading cart...
                </div>

                <div class="total">
                    <span>Grand Total</span>
                    <span id="checkoutTotal">₹0.00</span>
                </div>

                <a class="back-link" href="cart.html">
                    Back to Cart
                </a>
            </section>
        </div>
    </main>

    <script src="checkout.js"></script>
</body>
</html>
