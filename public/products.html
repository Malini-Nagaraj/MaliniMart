<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaliniMart - Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="products-container">

        <!-- Website Title -->
        <h1>MaliniMart</h1>

        <!-- Top Navigation -->
        <div class="top-bar">

            <h2>Products</h2>

            <div>
                <button onclick="goToCart()">
                    Cart
                </button>

                <button onclick="logout()">
                    Logout
                </button>
            </div>

        </div>

        <!-- Products will be displayed here -->
        <div id="productsList">
            Loading products...
        </div>

    </div>

    <!-- JavaScript -->
    <script src="products.js"></script>

</body>

</html>
