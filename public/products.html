<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaliniMart - Products</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5fa;
            color: #222;
        }

        header {
            background: #673de6;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav button, .add-cart {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        nav button {
            background: white;
            color: #5427cc;
        }

        .welcome {
            margin: 25px auto;
            width: 92%;
            padding: 30px;
            border-radius: 15px;
            background: linear-gradient(120deg, #e4d9ff, #f4eaff);
        }

        .welcome h2 { color: #5128c8; }

        .search-area, .products-section {
            width: 92%;
            margin: 25px auto;
        }

        #searchInput {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            display: block;
            background: white;
        }

        .product-description {
            color: #666;
            line-height: 1.5;
            flex-grow: 1;
        }

        .product-price {
            color: #5427cc;
            font-size: 22px;
        }

        .add-cart {
            background: #673de6;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        footer {
            margin-top: 50px;
            padding: 22px;
            background: #eeeaf9;
            color: #666;
            text-align: center;
        }

        @media (max-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .product-image { height: 150px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">MaliniMart</div>
        <nav>
            <button onclick="goToCart()">🛒 Cart</button>
            <button onclick="goToOrders()">My Orders</button>
            <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <section class="welcome">
        <h2>Welcome to MaliniMart!</h2>
        <p>Discover electronics and everyday essentials at great prices.</p>
    </section>

    <section class="search-area">
        <input id="searchInput" type="text"
               placeholder="Search for headphones, mouse, speaker...">
    </section>

    <main class="products-section">
        <h2>Our Products</h2>
        <div id="productsList" class="products-grid">
            <p>Loading products...</p>
        </div>
    </main>

    <footer>© 2026 MaliniMart | Happy Shopping!</footer>

    <script src="products.js"></script>

    <script>
        document.getElementById("searchInput").addEventListener("input", function () {
            const searchText = this.value.toLowerCase();

            document.querySelectorAll(".product-card").forEach(function (card) {
                card.style.display =
                    card.textContent.toLowerCase().includes(searchText)
                    ? "flex" : "none";
            });
        });
    </script>
</body>
</html>
